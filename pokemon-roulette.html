<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .roulette-wheel {
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
            position: relative;
            perspective: 1000px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #FFD700;
            background: conic-gradient(
                from 0deg,
                #FF6B6B 0deg 60deg,
                #4ECDC4 60deg 120deg,
                #45B7D1 120deg 180deg,
                #FFA07A 180deg 240deg,
                #98D8C8 240deg 300deg,
                #F7DC6F 300deg 360deg
            );
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s linear;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .wheel.spinning {
            animation: spin 0.1s linear;
        }

        @keyframes spin {
            to {
                transform: rotate(6deg);
            }
        }

        .wheel-center {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            border: 4px solid #FFD700;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-weight: bold;
            color: #667eea;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #FFD700;
            z-index: 20;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.3));
        }

        .pokemon-display {
            margin: 30px 0;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .pokemon-image {
            width: 150px;
            height: 150px;
            margin-bottom: 15px;
            object-fit: contain;
        }

        .pokemon-info {
            text-align: center;
        }

        .pokemon-name {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            text-transform: capitalize;
            margin-bottom: 5px;
        }

        .pokemon-id {
            font-size: 1em;
            color: #999;
        }

        .pokemon-types {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .type-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            color: white;
            text-transform: capitalize;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            max-width: 250px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .reset-btn {
            background: #f0f0f0;
            color: #667eea;
            padding: 12px 30px;
            font-size: 0.95em;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            padding: 15px;
            background: #fadbd8;
            border-radius: 10px;
            margin-top: 15px;
        }

        .history {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .history-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .history-item {
            padding: 8px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 0.9em;
            color: #667eea;
            font-weight: bold;
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 Pokemon Roulette</h1>
        
        <div class="roulette-wheel">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>

        <div class="pokemon-display" id="pokemonDisplay">
            <p class="loading">Spin the wheel to get a random Pokemon!</p>
        </div>

        <div class="button-group">
            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">🎲 Spin</button>
            <button class="reset-btn" onclick="resetGame()">Reset</button>
        </div>

        <div class="history" id="historySection" style="display: none;">
            <div class="history-title">Your Catches:</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        let allPokemon = [];
        let isSpinning = false;
        let currentRotation = 0;
        let history = [];
        const pokemonCount = 151; // Gen 1 Pokemon

        // Type colors
        const typeColors = {
            normal: '#A8A878',
            fighting: '#C03028',
            flying: '#A890F0',
            poison: '#A040A0',
            ground: '#E0C068',
            rock: '#B8A038',
            bug: '#A8B820',
            ghost: '#705898',
            steel: '#B8B8D0',
            fire: '#F08030',
            water: '#6890F0',
            grass: '#78C850',
            electric: '#F8D030',
            psychic: '#F85888',
            ice: '#98D8D8',
            dragon: '#7038F8',
            dark: '#705848',
            fairy: '#EE99AC'
        };

        // Initialize the game
        async function initGame() {
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.textContent = '⏳ Loading Pokemon...';

            try {
                // Fetch first 151 Pokemon
                for (let i = 1; i <= pokemonCount; i++) {
                    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${i}`);
                    const data = await response.json();
                    allPokemon.push({
                        id: data.id,
                        name: data.name,
                        image: data.sprites.other['official-artwork'].front_default || data.sprites.front_default,
                        types: data.types.map(t => t.type.name)
                    });
                }
                
                spinBtn.disabled = false;
                spinBtn.textContent = '🎲 Spin';
                console.log('Pokemon loaded:', allPokemon.length);
            } catch (error) {
                console.error('Error loading Pokemon:', error);
                document.getElementById('pokemonDisplay').innerHTML = `
                    <div class="error">Failed to load Pokemon data. Please refresh the page.</div>
                `;
                spinBtn.textContent = '🎲 Spin';
            }
        }

        function spinWheel() {
            if (isSpinning || allPokemon.length === 0) return;

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;

            // Random spin amount (at least 5 full rotations + random offset)
            const spins = 5 + Math.random() * 5;
            const randomOffset = Math.random() * 360;
            const totalRotation = spins * 360 + randomOffset;

            const wheel = document.getElementById('wheel');
            wheel.style.transition = 'transform 3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            currentRotation += totalRotation;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // After spinning, get the result
            setTimeout(() => {
                const normalizedRotation = currentRotation % 360;
                const sectionSize = 360 / pokemonCount;
                const index = Math.floor((360 - normalizedRotation) / sectionSize) % pokemonCount;
                
                displayPokemon(allPokemon[index]);
                isSpinning = false;
                spinBtn.disabled = false;
            }, 3000);
        }

        function displayPokemon(pokemon) {
            const display = document.getElementById('pokemonDisplay');
            const typesList = pokemon.types
                .map(type => `<span class="type-badge" style="background-color: ${typeColors[type] || '#999'}">${type}</span>`)
                .join('');

            display.innerHTML = `
                <img src="${pokemon.image}" alt="${pokemon.name}" class="pokemon-image" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                <div class="pokemon-info">
                    <div class="pokemon-name">${pokemon.name}</div>
                    <div class="pokemon-id">#${pokemon.id}</div>
                    <div class="pokemon-types">${typesList}</div>
                </div>
            `;

            // Add to history
            if (!history.some(p => p.id === pokemon.id)) {
                history.push(pokemon);
                updateHistory();
            }
        }

        function updateHistory() {
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            if (history.length > 0) {
                historySection.style.display = 'block';
                historyList.innerHTML = history
                    .map(p => `<div class="history-item">${p.name}</div>`)
                    .join('');
            }
        }

        function resetGame() {
            history = [];
            currentRotation = 0;
            document.getElementById('wheel').style.transform = 'rotate(0deg)';
            document.getElementById('pokemonDisplay').innerHTML = '<p class="loading">Spin the wheel to get a random Pokemon!</p>';
            document.getElementById('historySection').style.display = 'none';
        }

        // Start the game when page loads
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
